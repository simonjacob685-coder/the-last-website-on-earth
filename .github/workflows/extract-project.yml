name: Extract project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f

      - name: Move project files to repository root
        run: |
          if [ -d extracted ]; then
            cp -a extracted/. .
          fi

          find . -type d -name "__MACOSX" -prune -exec rm -rf {} \; || true
          find . -type f -name ".DS_Store" -delete || true

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Extract website project from ZIP" || echo "Nothing to commit"
          git push
